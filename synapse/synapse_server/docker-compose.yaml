services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: "h8RlbViZWrd1cAh914a9vjSFmEhHOGPB"
    volumes:
      - synapse_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "3296GRixPbVvHkXKP9LeIHWX7L0tBrYj"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: synapse_test
      POSTGRES_PASSWORD: "cjm_SL7hxVlT2dLszH9CwLjZi9fxNegY"
    volumes:
      - synapse_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "UB85q5RDQcZ6WfccAETSWFmS_vemSjTf"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  synapse_data:
  synapse_test_data:
